<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://www.google.com/s2/favicons?domain=https://youtube.com&sz=256" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="sidebar-full">
<div class="backdrop" id="backdrop"></div>
<header class="header">
  <div class="header-left">
    <button class="icon-btn" id="menuToggle" aria-label="Menu"><span class="material-symbols-rounded">menu</span></button>
    <div class="brand" id="homeLogo" role="link" tabindex="0" aria-label="YouTube home">
      <svg class="brand-svg" viewBox="0 0 90 20" focusable="false">
        <rect width="24" height="20" rx="4" fill="#f00"/><polygon points="10,6 16,10 10,14" fill="#fff"/>
        <text x="30" y="14" fill="#fff" font-size="11" font-family="Roboto, sans-serif">YouTube</text>
      </svg>
    </div>
  </div>
  <div class="header-center">
    <div class="search-wrapper">
      <input id="searchInput" type="text" placeholder="Search" class="search-input" autocomplete="off" aria-label="Search">
      <button class="search-btn" id="searchButton" aria-label="Search"><span class="material-symbols-rounded">search</span></button>
      <div id="autocomplete" class="autocomplete"></div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications"><span class="material-symbols-rounded">notifications</span></button>
    <button class="icon-btn" id="accountBtn" aria-label="Account"><span class="material-symbols-rounded">account_circle</span></button>
  </div>
</header>
<main class="main">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-section">
      <a class="sidebar-item active" data-page="home" data-tooltip="Home"><span class="material-symbols-rounded sidebar-icon">home</span><span class="sidebar-label">Home</span></a>
      <a class="sidebar-item" data-page="shorts" data-tooltip="Shorts"><span class="material-symbols-rounded sidebar-icon">play_circle</span><span class="sidebar-label">Shorts</span></a>
      <a class="sidebar-item" data-page="subscriptions" data-tooltip="Subscriptions"><span class="material-symbols-rounded sidebar-icon">subscriptions</span><span class="sidebar-label">Subscriptions</span></a>
    </nav>
    <hr class="sidebar-divider">
    <nav class="sidebar-section">
      <a class="sidebar-item" data-page="library" data-tooltip="Library"><span class="material-symbols-rounded sidebar-icon">video_library</span><span class="sidebar-label">Library</span></a>
      <a class="sidebar-item" data-page="history" data-tooltip="History"><span class="material-symbols-rounded sidebar-icon">history</span><span class="sidebar-label">History</span></a>
      <a class="sidebar-item" data-page="liked" data-tooltip="Liked videos"><span class="material-symbols-rounded sidebar-icon">thumb_up</span><span class="sidebar-label">Liked videos</span></a>
    </nav>
  </aside>
  <section class="content">
    <div class="chips-row" id="chipsRow">
      <button class="chip active" data-query="">All</button>
      <button class="chip" data-query="Music">Music</button>
      <button class="chip" data-query="Gaming">Gaming</button>
      <button class="chip" data-query="News">News</button>
      <button class="chip" data-query="Live">Live</button>
      <button class="chip" data-query="Vlogs">Vlogs</button>
      <button class="chip" data-query="Programming">Programming</button>
      <button class="chip" data-query="Cooking">Cooking</button>
    </div>
    <div id="mainSection">
      <div id="subList" class="chips-row" hidden></div>
      <h2 id="pageTitle" class="section-header" hidden></h2>
      <div id="status" class="empty-state" hidden></div>
      <div id="resultsGrid" class="video-grid"></div>
      <div id="sentinel"></div>
      <div id="moreLoader" class="more-loader" hidden><div class="loader small"></div></div>
    </div>
    <div id="shortsSection" hidden>
      <h2 class="section-header">Shorts</h2>
      <div id="shortsStatus" class="empty-state" hidden></div>
      <div id="shortsGrid" class="shorts-grid"></div>
    </div>
    <div id="watchLayout" class="watch-layout" hidden>
      <div class="watch-left">
        <div class="watch-player">
          <iframe id="mainPlayer" title="YouTube player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
          <div id="cp" class="cp paused" hidden>
            <video id="video" playsinline preload="auto"></video>
            <div class="cp-spin"><div class="loader small"></div></div>
            <div class="cp-err" id="cpErr" hidden>
              <span class="material-symbols-rounded">error</span>
              <p id="cpErrMsg"></p>
              <button class="pill-btn" id="cpErrBtn">Use YouTube player</button>
            </div>
            <div class="cp-ctrl">
              <input type="range" id="cpSeek" class="cp-seek" min="0" max="1000" value="0" aria-label="Seek">
              <div class="cp-row">
                <button id="cpPlay" aria-label="Play"><span class="material-symbols-rounded">play_arrow</span></button>
                <button id="cpMute" aria-label="Mute"><span class="material-symbols-rounded">volume_up</span></button>
                <input type="range" id="cpVol" class="cp-vol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                <span id="cpTime" class="cp-time">0:00 / 0:00</span>
                <span class="cp-gap"></span>
                <button id="cpSpeed" class="cp-speed" aria-label="Playback speed">1×</button>
                <button id="cpPip" aria-label="Picture in picture"><span class="material-symbols-rounded">picture_in_picture_alt</span></button>
                <button id="cpFs" aria-label="Fullscreen"><span class="material-symbols-rounded">fullscreen</span></button>
              </div>
            </div>
          </div>
        </div>
        <h1 id="watchTitle" class="watch-title"></h1>
        <div class="watch-meta-row">
          <div class="watch-channel">
            <img id="watchChannelAvatar" class="watch-channel-avatar" alt="">
            <div>
              <div id="watchChannelName" class="watch-channel-name"></div>
              <div id="watchViews" class="watch-views"></div>
            </div>
            <button id="subBtn" class="pill-btn sub">Subscribe</button>
          </div>
          <div class="watch-actions">
            <div class="embed-toggle">
              <button id="embedYoutube" class="active">YouTube</button>
              <button id="embedTheta">Ad-less</button>
            </div>
            <button id="likeBtn" class="pill-btn"><span class="material-symbols-rounded">thumb_up</span><span id="likeText">Like</span></button>
            <button id="shareBtn" class="pill-btn"><span class="material-symbols-rounded">share</span><span>Share</span></button>
            <button id="downloadBtn" class="pill-btn"><span class="material-symbols-rounded">download</span><span id="downloadText">Download</span></button>
          </div>
        </div>
        <div id="watchDescription" class="watch-description"></div>
      </div>
      <div class="watch-right"><div id="relatedList" class="related-list"></div></div>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
